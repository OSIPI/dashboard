services:
  frontend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./frontend/:/app
      - /app/node_modules
    ports:
      - '${FRONTEND_PORT:-60010}:37183'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - FRONTEND_PORT=37183
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port $$FRONTEND_PORT --strictPort"
    restart: unless-stopped
