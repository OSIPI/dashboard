<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title description">
  <title id="title">Browser-local scientific computing with Pyodide</title>
  <desc id="description">The frontend sends validated data and settings to a dedicated worker running Python, NumPy and OSIPY, then receives results and diagnostics. Runtime assets are downloaded from CDNs; fitting inputs remain in the browser.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#df8278"/></marker></defs>
  <rect width="960" height="460" rx="16" fill="#141414"/>
  <g font-family="system-ui, sans-serif" fill="#eeeeee">
    <text x="32" y="44" font-size="23" font-weight="700">One browser. No fitting server.</text>
    <text x="32" y="72" font-size="14" fill="#bcbcbc">Architecture of the isolated IVIM proof of concept</text>
    <rect x="32" y="102" width="896" height="276" rx="14" fill="#1c1c1c" stroke="#555555"/>
    <text x="52" y="130" font-size="13" fill="#bcbcbc">BROWSER BOUNDARY</text>
    <rect x="56" y="158" width="274" height="176" rx="10" fill="#292929"/>
    <text x="76" y="191" font-size="19" font-weight="600">Svelte frontend</text>
    <text x="76" y="222" font-size="14">Bounded numeric inputs</text>
    <text x="76" y="249" font-size="14">Controls, charts and diagnostics</text>
    <text x="76" y="276" font-size="14">Job identity and cancellation</text>
    <rect x="624" y="158" width="280" height="176" rx="10" fill="#292929"/>
    <text x="644" y="191" font-size="19" font-weight="600">Dedicated Web Worker</text>
    <text x="644" y="222" font-size="14">Pyodide / CPython / NumPy</text>
    <text x="644" y="249" font-size="14">Real OSIPY fitting functions</text>
    <text x="644" y="276" font-size="14">CPU, serial Python execution</text>
    <path d="M345 214H605" fill="none" stroke="#df8278" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="475" y="198" text-anchor="middle" font-size="13">Validated data + settings</text>
    <path d="M605 280H345" fill="none" stroke="#df8278" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="475" y="306" text-anchor="middle" font-size="13">Results + provenance</text>
    <text x="52" y="359" font-size="13" fill="#bcbcbc">Input and fitted results stay local. A worker is not a sandbox for untrusted packages.</text>
    <path d="M764 395V343" fill="none" stroke="#df8278" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="32" y="416" font-size="14" fill="#bcbcbc">External downloads: pinned runtime and package assets only</text>
    <text x="32" y="439" font-size="13" fill="#bcbcbc">CDN access is required; offline operation is not guaranteed.</text>
  </g>
</svg>
