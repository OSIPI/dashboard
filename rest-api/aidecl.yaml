schema_version: "1.0.0"

project:
  name: osipy-rest-api
  version: "0.1.0"
  repository: https://github.com/OSIPI/osipy-rest-api
  license: Apache-2.0
  content_type: software

ai_usage:
  used: true
  level: significant
  summary: >-
    An autonomous coding agent (Claude Code) implemented the FastAPI backend
    wrapping the osipy IVIM pipeline from a human-approved design spec, in
    September 2026, working task-by-task from a written implementation plan.
    All AI output is reviewed by the maintainer before merge.
  tools:
    - name: Claude Code
      vendor: Anthropic
      type: agent
      model: claude-sonnet-5
      hosting: cloud_vendor
      period: { start: "2026-09-09" }
      purpose: [code generation, test writing, documentation]
    - name: rseng-agent-skills
      type: standalone
      version: "0.1.0"
      skills_consulted:
        [rseng-quality-framework, rseng-project-tracking, rseng-testing,
         rseng-defensive-coding, rseng-reproducible-environments,
         rseng-version-control-review, rseng-code-review,
         rseng-citation-metadata, rseng-licensing, rseng-ai-declaration,
         rseng-honesty, rseng-human-verification, rseng-agent-security]
  activities: [code_generation, testing, documentation]
  scope:
    code_generation: true
    code_review: false
    documentation: true
    testing: true
    infrastructure: true
  components:
    - name: project scaffold
      description: pyproject.toml, packaging, license, gitignore, config template
      ai_involvement: >-
        Generated by the agent from the implementation plan, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: synthetic test fixtures
      description: tests/fixtures/synthetic.py — synthetic IVIM volume + NIfTI/bval generators
      ai_involvement: >-
        Generated by the agent, implementation plan task 2, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: config, domain, errors
      description: config.py (Settings), core/domain.py (dataclasses), core/errors.py (typed API errors)
      ai_involvement: >-
        Generated by the agent, implementation plan task 3, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: NIfTI I/O
      description: core/nifti_io.py — in-memory NIfTI/bval parse and parameter-map serialization
      ai_involvement: >-
        Generated by the agent, implementation plan task 4, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: in-memory storage
      description: core/storage.py — Storage protocol, InMemoryStorage with capacity caps and TTL sweep
      ai_involvement: >-
        Generated by the agent, implementation plan task 5, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: osipy IVIM integration
      description: core/ivim.py — the sole osipy consumer besides nifti_io; validate, run_fit, build_summary, voxel_detail
      ai_involvement: >-
        Generated by the agent, implementation plan task 6, 2026-09-10.
        Contains scientific-judgment choices flagged for human review.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: background job runner
      description: core/jobs.py — JobRunner protocol, InProcessJobRunner (semaphore, progress bridging, evicted-dataset handling)
      ai_involvement: >-
        Generated by the agent, implementation plan task 7, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: API schemas and dependency container
      description: models/schemas.py (pydantic request/response models), deps.py (DI container)
      ai_involvement: >-
        Generated by the agent, implementation plan task 8, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: app factory and meta routes
      description: main.py (build_app, lifespan sweep, CORS, error handler, ASGI app), api/meta.py
      ai_involvement: >-
        Generated by the agent, implementation plan task 9, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: datasets router
      description: api/datasets.py — upload, retrieval, deletion endpoints
      ai_involvement: >-
        Generated by the agent, implementation plan task 10, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: fits router
      description: api/fits.py — start-fit and poll-status endpoints
      ai_involvement: >-
        Generated by the agent, implementation plan task 11, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: results router
      description: api/results.py — parameter-map download, maps zip, voxel-detail endpoints
      ai_involvement: >-
        Generated by the agent, implementation plan task 12, 2026-09-10.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: test suite
      description: tests/ — conftest harness plus per-module suites and the end-to-end full-flow test (69 tests)
      ai_involvement: >-
        Generated by the agent, implementation plan tasks 2 and 4-13,
        2026-09-10. Reference-case fit tolerances are scientific decisions
        flagged for human review.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.
    - name: CI workflow and citation metadata
      description: .github/workflows/ci.yml (ruff + smoke + full pytest), CITATION.cff, codemeta.json
      ai_involvement: >-
        Generated by the agent, implementation plan task 13, 2026-09-10.
        CITATION.cff validated with cffconvert.
      tools_used: [Claude Code]
      notes: NOT yet reviewed line by line by a human.

declaration:
  date: "2026-09-10"
  declared_by: Djura Smits
  contact: djura.smits@gmail.com
  reviewed_by: pending
  notes: >-
    2026-09-10 initial declaration; scaffold task. Awaiting human review.
    2026-09-10 implementation complete (plan tasks 1-13): full FastAPI backend,
    69 tests passing, ruff clean, live uvicorn entry point verified end to end.
    Every module built by the agent and listed under components is NOT yet
    reviewed line by line by a human; the scientific-judgment points
    (auto-mask percentile, b_threshold validation, fit tolerances,
    biexponential voxel model) still require maintainer review before reliance.
